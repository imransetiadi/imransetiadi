name: GitHub Activity

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/github-script@v7
        id: stats
        with:
          github-token: ${{ secrets.METRICS_TOKEN }}
          script: |
            const username = "imransetiadi";

            const query = `
              query($login: String!) {
                user(login: $login) {
                  contributionsCollection {
                    totalCommitContributions
                    totalPullRequestContributions
                    totalIssueContributions
                    totalPullRequestReviewContributions
                    restrictedContributionsCount
                    contributionCalendar {
                      totalContributions
                    }
                  }
                }
              }
            `;

            const res = await github.graphql(query, { login: username });
            const c = res.user.contributionsCollection;

            const md = `
## 📊 GitHub Activity Overview

| Activity | Total |
|---|---:|
| 🟩 Total Contributions | ${c.contributionCalendar.totalContributions} |
| 💻 Commits | ${c.totalCommitContributions} |
| 🔀 Pull Requests | ${c.totalPullRequestContributions} |
| 🐛 Issues | ${c.totalIssueContributions} |
| 👀 Code Reviews | ${c.totalPullRequestReviewContributions} |
| 🔒 Private Contributions | ${c.restrictedContributionsCount} |

_Last updated automatically by GitHub Actions._
`;

            core.setOutput("content", md);

      - name: Update README
        run: |
          python3 <<'PY'
          from pathlib import Path
          import os

          readme = Path("README.md")
          content = os.environ["ACTIVITY"]

          start = "<!-- GITHUB-ACTIVITY:START -->"
          end = "<!-- GITHUB-ACTIVITY:END -->"

          text = readme.read_text()

          if start not in text:
              text += f"\n\n{start}\n{content}\n{end}\n"
          else:
              before = text.split(start)[0]
              after = text.split(end)[1]
              text = before + start + "\n" + content + "\n" + end + after

          readme.write_text(text)
          PY
        env:
          ACTIVITY: ${{ steps.stats.outputs.content }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update GitHub activity" || exit 0
          git push
