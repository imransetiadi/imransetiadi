name: GitHub Activity

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Update README activity
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: >-
            const username = "imransetiadi";
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const query = `query($login:String!){user(login:$login){contributionsCollection{contributionCalendar{totalContributions}totalCommitContributions totalIssueContributions totalPullRequestContributions totalPullRequestReviewContributions restrictedContributionsCount}}}`;
            const result = await github.graphql(query, {login: username});
            const c = result.user.contributionsCollection;
            const start = "<!-- GITHUB_ACTIVITY_START -->";
            const end = "<!-- GITHUB_ACTIVITY_END -->";
            const activity = "## 📊 GitHub Activity Overview\n\n" +
              "| Activity | Count |\n" +
              "|---|---:|\n" +
              "| 🟩 Total Contributions | " + c.contributionCalendar.totalContributions + " |\n" +
              "| 💻 Commits | " + c.totalCommitContributions + " |\n" +
              "| 🔀 Pull Requests | " + c.totalPullRequestContributions + " |\n" +
              "| 🐛 Issues | " + c.totalIssueContributions + " |\n" +
              "| 👀 Code Reviews | " + c.totalPullRequestReviewContributions + " |\n" +
              "| 🔒 Private Contributions | " + c.restrictedContributionsCount + " |\n\n" +
              "_Last updated: " + new Date().toISOString() + "_";
            const file = await github.rest.repos.getContent({owner, repo, path: "README.md"});
            const oldText = Buffer.from(file.data.content, "base64").toString("utf8");
            const block = start + "\n" + activity + "\n" + end;
            let newText;
            if (oldText.includes(start) && oldText.includes(end)) {
              newText = oldText.split(start)[0] + block + oldText.split(end)[1];
            } else {
              newText = oldText.trimEnd() + "\n\n" + block + "\n";
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path: "README.md",
              message: "Update GitHub activity",
              content: Buffer.from(newText).toString("base64"),
              sha: file.data.sha
            });
