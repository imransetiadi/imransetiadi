name: GitHub Activity

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate GitHub Activity
        uses: actions/github-script@v7
        id: github_activity
        with:
          github-token: ${{ secrets.METRICS_TOKEN }}
          script: |
            const username = "imransetiadi";

            const query = `
              query($login: String!) {
                user(login: $login) {
                  contributionsCollection {
                    contributionCalendar {
                      totalContributions
                    }
                    totalCommitContributions
                    totalIssueContributions
                    totalPullRequestContributions
                    totalPullRequestReviewContributions
                    restrictedContributionsCount
                  }
                }
              }
            `;

            const result = await github.graphql(query, { login: username });
            const c = result.user.contributionsCollection;

            const markdown = [
              "## 📊 GitHub Activity Overview",
              "",
              "| Activity | Count |",
              "|---|---:|",
              `| 🟩 Total Contributions | ${c.contributionCalendar.totalContributions} |`,
              `| 💻 Commits | ${c.totalCommitContributions} |`,
              `| 🔀 Pull Requests | ${c.totalPullRequestContributions} |`,
              `| 🐛 Issues | ${c.totalIssueContributions} |`,
              `| 👀 Code Reviews | ${c.totalPullRequestReviewContributions} |`,
              `| 🔒 Private Contributions | ${c.restrictedContributionsCount} |`,
              "",
              `_Last updated: ${new Date().toISOString()}_`
            ].join("\n");

            core.setOutput("content", markdown);

      - name: Update README
        env:
          ACTIVITY_CONTENT: ${{ steps.github_activity.outputs.content }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          readme = Path("README.md")
          start = "<!-- GITHUB_ACTIVITY_START -->"
          end = "<!-- GITHUB_ACTIVITY_END -->"
          content = os.environ["ACTIVITY_CONTENT"]

          if readme.exists():
              text = readme.read_text()
          else:
              text = "# Imran Setiadi\n"

          block = start + "\n" + content + "\n" + end

          if start in text and end in text:
              before = text.split(start)[0]
              after = text.split(end)[1]
              text = before + block + after
          else:
              text = text.rstrip() + "\n\n" + block + "\n"

          readme.write_text(text)
          PY

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m "Update GitHub activity"
          git push
