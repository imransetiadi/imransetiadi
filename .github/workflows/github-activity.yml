name: GitHub Activity

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  push:
    branches: [main]
    paths:
      - ".github/scripts/update-activity.mjs"
      - ".github/workflows/github-activity.yml"

permissions:
  contents: write

concurrency:
  group: github-activity
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate activity section
        env:
          # Optional: add a PAT secret named GH_PAT (scope: read:user) to include private contributions.
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: node .github/scripts/update-activity.mjs imransetiadi

      - name: Commit changes
        run: |
          if git diff --quiet README.md; then
            echo "No changes"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update GitHub activity"
          git push
